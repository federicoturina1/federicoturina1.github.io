<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Federico Turina</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            background: #ffffff;
            color: #171717;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
        }

        .profile-photo {
            width: 180px;
            height: 180px;

            object-fit: cover;

            border-radius: 50%;

            border: 1px solid #e5e5e5;

            margin-bottom: 30px;
        }

        h1 {
            font-size: 42px;
            font-weight: 600;
            letter-spacing: -1.5px;
            margin-bottom: 8px;
        }

        .role {
            font-size: 19px;
            color: #777;
            margin-bottom: 32px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .button {
            display: inline-block;

            padding: 12px 24px;

            border-radius: 6px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition: all 0.2s ease;
        }

        .download {
            background: #171717;
            color: white;
        }

        .download:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .linkedin {
            border: 1px solid #d6d6d6;
            color: #171717;
        }

        .linkedin:hover {
            border-color: #999;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {

            .profile-photo {
                width: 150px;
                height: 150px;
            }

            h1 {
                font-size: 34px;
            }

            .role {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            src="foto.jpg"
            alt="Federico Turina"
            class="profile-photo"
        >

        <h1>Federico Turina</h1>

        <p class="role">
            Assistant Bar Manager
        </p>

        <div class="buttons">

            <a
                href="ITCV2026.pdf"
                download
                class="button download"
            >
                Download CV
            </a>

            <a
                href="INSERISCI-QUI-LINKEDIN"
                target="_blank"
                class="button linkedin"
            >
                LinkedIn
            </a>

        </div>

    </main>

</body>
</html>
