<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Federico Turina | Assistant Bar Manager</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #eee9df;
            color: #26231f;
            font-family: 'Montserrat', sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 60px 30px;
        }

        .content {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        /* FOTO */

        .photo {
            width: 210px;
            height: 210px;

            border-radius: 50%;
            object-fit: cover;

            border: 1px solid #b49a6a;
            padding: 6px;

            margin-bottom: 30px;
        }

        /* NOME */

        h1 {
            font-family: 'Cormorant Garamond', serif;

            font-size: clamp(46px, 6vw, 68px);

            font-weight: 500;
            line-height: 1;
            letter-spacing: -1px;

            white-space: nowrap;

            margin-bottom: 12px;
        }

        /* RUOLO */

        .role {
            font-family: 'Cormorant Garamond', serif;

            font-size: 26px;
            font-weight: 400;

            color: #6f665c;

            margin-bottom: 30px;
        }

        /* LINEA */

        .line {
            width: 45px;
            height: 1px;

            background: #b49a6a;

            margin: 0 auto 30px;
        }

        /* PULSANTE */

        .button {
            display: inline-block;

            min-width: 170px;

            padding: 14px 25px;

            background: #26231f;
            color: #eee9df;

            text-decoration: none;

            font-size: 11px;
            letter-spacing: 2px;

            text-transform: uppercase;

            transition: all 0.3s ease;
        }

        .button:hover {
            background: #9a8157;
        }

        /* SMARTPHONE */

        @media (max-width: 700px) {

            .page {
                padding: 40px 20px;
            }

            .photo {
                width: 170px;
                height: 170px;
                margin-bottom: 25px;
            }

            h1 {
                font-size: 46px;
                white-space: nowrap;
            }

            .role {
                font-size: 23px;
            }

            .button {
                width: 190px;
            }
        }

    </style>

</head>

<body>

    <main class="page">

        <div class="content">

            <img
                src="foto.JPEG"
                alt="Federico Turina"
                class="photo"
            >

            <h1>
                Federico Turina
            </h1>

            <p class="role">
                Assistant Bar Manager
            </p>

            <div class="line"></div>

            <a
                href="ITCV2026.pdf"
                download
                class="button"
            >
                Download CV
            </a>

        </div>

    </main>

</body>
</html>
