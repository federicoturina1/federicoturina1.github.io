<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Federico Turina | Assistant Bar Manager</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap');


        /* RESET */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* PAGINA */

        body {
            min-height: 100vh;

            background: #eee9df;

            color: #26231f;

            font-family: 'Montserrat', sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 60px 30px;
        }


        .content {
            width: 100%;
            max-width: 900px;

            text-align: center;
        }


        /* FOTO */

        .photo {
            width: 210px;
            height: 210px;

            border-radius: 50%;

            object-fit: cover;

            border: 1px solid #b49a6a;

            padding: 6px;

            margin-bottom: 30px;
        }


        /* NOME */

        h1 {
            font-family: 'Cormorant Garamond', serif;

            font-size: clamp(46px, 6vw, 68px);

            font-weight: 500;

            line-height: 1;

            letter-spacing: -1px;

            white-space: nowrap;

            margin-bottom: 12px;
        }


        /* PROFESSIONE */

        .role {
            font-family: 'Cormorant Garamond', serif;

            font-size: 26px;

            font-weight: 400;

            color: #6f665c;

            margin-bottom: 30px;
        }


        /* LINEA DECORATIVA */

        .line {
            width: 45px;

            height: 1px;

            background: #b49a6a;

            margin: 0 auto 30px;
        }


        /* CONTENITORE PULSANTI */

        .buttons {
            display: flex;

            justify-content: center;

            gap: 15px;
        }


        /* PULSANTI */

        .button {
            min-width: 150px;

            padding: 14px 25px;

            text-decoration: none;

            font-size: 11px;

            letter-spacing: 2px;

            text-transform: uppercase;

            transition: all 0.3s ease;
        }


        /* DOWNLOAD CV */

        .cv {
            background: #26231f;

            color: #eee9df;
        }


        .cv:hover {
            background: #9a8157;
        }


        /* LINKEDIN */

        .linkedin {
            border: 1px solid #9a8157;

            color: #26231f;

            background: transparent;
        }


        .linkedin:hover {
            background: #9a8157;

            color: white;
        }


        /* SMARTPHONE */

        @media (max-width: 700px) {

            .page {
                padding: 40px 20px;
            }


            .photo {
                width: 170px;
                height: 170px;

                margin-bottom: 25px;
            }


            h1 {
                font-size: 46px;

                white-space: nowrap;
            }


            .role {
                font-size: 23px;
            }


            .buttons {
                flex-direction: column;

                align-items: center;

                gap: 10px;
            }


            .button {
                width: 190px;
            }

        }

    </style>

</head>


<body>


    <main class="page">


        <div class="content">


            <!-- FOTO -->

            <img
                src="foto.JPEG"
                alt="Federico Turina"
                class="photo"
            >


            <!-- NOME -->

            <h1>
                Federico Turina
            </h1>


            <!-- PROFESSIONE -->

            <p class="role">
                Assistant Bar Manager
            </p>


            <!-- LINEA -->

            <div class="line"></div>


            <!-- PULSANTI -->

            <div class="buttons">


                <!-- DOWNLOAD CV -->

                <a
                    href="ITCV2026.pdf"
                    download
                    class="button cv"
                >
                    Download CV
                </a>


                <!-- LINKEDIN -->

                <a
                    href="https://www.linkedin.com/in/federico-turina-174465bb/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="button linkedin"
                >
                    LinkedIn
                </a>


            </div>


        </div>


    </main>


</body>

</html>
