<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Federico Turina | Assistant Bar Manager</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #eee9df;
            color: #26231f;
            font-family: 'Montserrat', sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 1200px;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 70px 40px;
        }

        .content {
            text-align: center;
            max-width: 700px;
        }

        .photo {
            width: 210px;
            height: 210px;

            border-radius: 50%;
            object-fit: cover;

            border: 1px solid #b49a6a;
            padding: 6px;

            margin-bottom: 38px;
        }

        .small-title {
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #9a8157;

            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(60px, 9vw, 100px);
            font-weight: 500;
            line-height: 0.9;
            letter-spacing: -2px;

            margin-bottom: 18px;
        }

        .role {
            font-family: 'Cormorant Garamond', serif;
            font-size: 27px;
            font-weight: 400;

            color: #6f665c;

            margin-bottom: 38px;
        }

        .line {
            width: 45px;
            height: 1px;
            background: #b49a6a;

            margin: 0 auto 38px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .button {
            min-width: 150px;

            padding: 14px 25px;

            text-decoration: none;

            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;

            transition: all 0.3s ease;
        }

        .cv {
            background: #26231f;
            color: #eee9df;
        }

        .cv:hover {
            background: #9a8157;
        }

        .linkedin {
            border: 1px solid #9a8157;
            color: #26231f;
        }

        .linkedin:hover {
            background: #9a8157;
            color: white;
        }

        @media (max-width: 600px) {

            .page {
                padding: 50px 20px;
            }

            .photo {
                width: 170px;
                height: 170px;
            }

            h1 {
                font-size: 60px;
            }

            .role {
                font-size: 23px;
            }

            .buttons {
                flex-direction: column;
                align-items: center;
            }

            .button {
                width: 190px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="content">

            <img
                src="foto.JPEG"
                alt="Federico Turina"
                class="photo"
            >

            <p class="small-title">
                Hospitality Professional
            </p>

            <h1>
                Federico<br>Turina
            </h1>

            <p class="role">
                Assistant Bar Manager
            </p>

            <div class="line"></div>

            <div class="buttons">

                <a
                    href="ITCV2026.pdf"
                    download
                    class="button cv"
                >
                    Download CV
                </a>

                <a
                    href="INSERISCI-LINK-LINKEDIN"
                    target="_blank"
                    class="button linkedin"
                >
                    LinkedIn
                </a>

            </div>

        </div>

    </main>

</body>
</html>
